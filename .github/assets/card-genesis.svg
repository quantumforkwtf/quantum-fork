<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="GENESIS STUDIO: Design the chain.">
<style>
  .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .spin,.spinr,.pop,.fade,.grow,.draw,.blink,.rise{transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.blink{animation:blink 1.8s ease-in-out infinite}</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect width="580" height="330" rx="20"/></clipPath>
    <radialGradient id="cgl" cx="290" cy="90" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c8ff4d" stop-opacity=".1"/><stop offset="1" stop-color="#c8ff4d" stop-opacity="0"/></radialGradient>
</defs>

  <g clip-path="url(#frame)">
    <rect width="580" height="330" fill="#0b0c0e"/>
    <rect width="580" height="178" fill="url(#grid)"/>
    <rect width="580" height="178" fill="url(#cgl)"/>
    <line x1="0" y1="178.5" x2="580" y2="178.5" stroke="#fff" stroke-opacity=".07"/>
    <g><g class="spin" style="animation-duration:9s;transform-origin:290px 90px;transform-box:view-box"><circle cx="290" cy="90" r="20" fill="none" stroke="#3dffa0" stroke-width="5" stroke-dasharray="30 10 8 10" stroke-linecap="round" opacity=".9"/></g><g class="spinr" style="animation-duration:14s;transform-origin:290px 90px;transform-box:view-box"><circle cx="290" cy="90" r="32" fill="none" stroke="#c8ff4d" stroke-width="5" stroke-dasharray="60 12 18 12" stroke-linecap="round" opacity=".9"/></g><g class="spin" style="animation-duration:11s;transform-origin:290px 90px;transform-box:view-box"><circle cx="290" cy="90" r="44" fill="none" stroke="#3dffa0" stroke-width="5" stroke-dasharray="14 8 40 8 6 8" stroke-linecap="round" opacity=".9"/></g><g class="spinr" style="animation-duration:19s;transform-origin:290px 90px;transform-box:view-box"><circle cx="290" cy="90" r="56" fill="none" stroke="#c8ff4d" stroke-width="5" stroke-dasharray="90 18 24 18" stroke-linecap="round" opacity=".9"/></g><g class="spin" style="animation-duration:16s;transform-origin:290px 90px;transform-box:view-box"><circle cx="290" cy="90" r="68" fill="none" stroke="#3dffa0" stroke-width="5" stroke-dasharray="36 10 10 10 70 12" stroke-linecap="round" opacity=".9"/></g><rect class="blink" x="280" y="80" width="4" height="4" fill="#c8ff4d" style="animation-delay:0.00s"/><rect class="blink" x="286" y="80" width="4" height="4" fill="#c8ff4d" style="animation-delay:0.23s"/><rect class="blink" x="292" y="80" width="4" height="4" fill="#c8ff4d" style="animation-delay:0.46s"/><rect class="blink" x="280" y="86" width="4" height="4" fill="#c8ff4d" style="animation-delay:0.69s"/><rect class="blink" x="286" y="86" width="4" height="4" fill="#c8ff4d" style="animation-delay:0.92s"/><rect class="blink" x="292" y="86" width="4" height="4" fill="#c8ff4d" style="animation-delay:1.15s"/><rect class="blink" x="280" y="92" width="4" height="4" fill="#c8ff4d" style="animation-delay:1.38s"/><rect class="blink" x="286" y="92" width="4" height="4" fill="#c8ff4d" style="animation-delay:1.61s"/><rect class="blink" x="292" y="92" width="4" height="4" fill="#c8ff4d" style="animation-delay:1.84s"/><circle cx="36" cy="50" r="4" fill="#3dffa0"/><text x="48" y="54" class="mono" font-size="11" letter-spacing="1" fill="#a3a29d">BUILT IN</text><circle cx="36" cy="74" r="4" fill="#4fe3ff"/><text x="48" y="78" class="mono" font-size="11" letter-spacing="1" fill="#a3a29d">YOUR CONTRACTS</text><circle cx="36" cy="98" r="4" fill="#ffd54a"/><text x="48" y="102" class="mono" font-size="11" letter-spacing="1" fill="#a3a29d">NEEDS INFRA</text><circle cx="36" cy="122" r="4" fill="#9d7bff"/><text x="48" y="126" class="mono" font-size="11" letter-spacing="1" fill="#a3a29d">RESEARCH</text>
    <text x="550" y="54" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#5a5b5c">TARGET</text>
    <text x="550" y="72" text-anchor="end" class="mono" font-size="12" fill="#eceae4">base · anvil · op-stack</text>
    <text x="550" y="108" text-anchor="end" class="mono" font-size="11" letter-spacing="1" fill="#5a5b5c">DOCUMENT HASH</text>
    <text x="550" y="126" text-anchor="end" class="mono" font-size="12" fill="#c8ff4d">0xc3848ff6…4f4c4959</text></g>
    <text x="30" y="214" class="mono" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#c8ff4d">01 · GENESIS STUDIO</text>
    <text x="30" y="252" class="sans" font-size="30" font-weight="750" letter-spacing="-.8" fill="#eceae4">Design the chain.</text>
    <text x="30" y="284" class="sans" font-size="17" fill="#a3a29d">One Chain DNA document, three targets:</text><text x="30" y="308" class="sans" font-size="17" fill="#a3a29d">contracts on Base, local Anvil, an OP Stack rollup.</text>
  </g>
  <rect x=".5" y=".5" width="579" height="329" rx="20" fill="none" stroke="#fff" stroke-opacity=".09"/>
  
</svg>
