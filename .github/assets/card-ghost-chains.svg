<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="GHOST CHAINS: Spawn ephemeral chains.">
<style>
  .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .spin,.spinr,.pop,.fade,.grow,.draw,.blink,.rise{transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.gb{opacity:0;animation:gb 7.5s ease infinite}
     @keyframes gb{0%{opacity:0;transform:scale(.6)}6%{opacity:1;transform:none}55%{opacity:1}75%{opacity:.25}88%,100%{opacity:0}}
     .gb{transform-box:fill-box;transform-origin:center}
     .s1,.s2,.s3{opacity:0}
     .s1{animation:s1 7.5s ease infinite}.s2{animation:s2 7.5s ease infinite}.s3{animation:s3 7.5s ease infinite}
     @keyframes s1{0%,8%{opacity:0}12%,54%{opacity:1}58%,100%{opacity:0}}
     @keyframes s2{0%,56%{opacity:0}60%,74%{opacity:1}78%,100%{opacity:0}}
     @keyframes s3{0%,76%{opacity:0}80%,96%{opacity:1}100%{opacity:0}}</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect width="580" height="330" rx="20"/></clipPath>
    <radialGradient id="cgl" cx="290" cy="90" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9d7bff" stop-opacity=".1"/><stop offset="1" stop-color="#9d7bff" stop-opacity="0"/></radialGradient>
</defs>

  <g clip-path="url(#frame)">
    <rect width="580" height="330" fill="#0b0c0e"/>
    <rect width="580" height="178" fill="url(#grid)"/>
    <rect width="580" height="178" fill="url(#cgl)"/>
    <line x1="0" y1="178.5" x2="580" y2="178.5" stroke="#fff" stroke-opacity=".07"/>
    <g><g>
        <text x="30" y="50" class="mono" font-size="12" fill="#eceae4">15m</text>
        <line x1="90" y1="46" x2="352" y2="46" stroke="#9d7bff" stroke-opacity=".2" stroke-dasharray="3 5"/>
        <rect class="gb" x="90" y="32" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:0.00s"/><rect class="gb" x="136" y="32" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:0.18s"/><rect class="gb" x="182" y="32" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:0.36s"/><rect class="gb" x="228" y="32" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:0.54s"/><rect class="gb" x="274" y="32" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:0.72s"/><rect class="gb" x="320" y="32" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:0.90s"/>
        <text class="s1 mono" x="550" y="50" text-anchor="end" font-size="11" letter-spacing="1" fill="#3dffa0" style="animation-delay:0s">RUNNING</text><text class="s2 mono" x="550" y="50" text-anchor="end" font-size="11" letter-spacing="1" fill="#ffd54a" style="animation-delay:0s">EXPIRING</text><text class="s3 mono" x="550" y="50" text-anchor="end" font-size="11" letter-spacing="1" fill="#5a5b5c" style="animation-delay:0s">TERMINATED</text>
      </g><g>
        <text x="30" y="96" class="mono" font-size="12" fill="#eceae4">1h</text>
        <line x1="90" y1="92" x2="352" y2="92" stroke="#9d7bff" stroke-opacity=".2" stroke-dasharray="3 5"/>
        <rect class="gb" x="90" y="78" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:1.20s"/><rect class="gb" x="136" y="78" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:1.38s"/><rect class="gb" x="182" y="78" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:1.56s"/><rect class="gb" x="228" y="78" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:1.74s"/><rect class="gb" x="274" y="78" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:1.92s"/><rect class="gb" x="320" y="78" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:2.10s"/>
        <text class="s1 mono" x="550" y="96" text-anchor="end" font-size="11" letter-spacing="1" fill="#3dffa0" style="animation-delay:1.2s">RUNNING</text><text class="s2 mono" x="550" y="96" text-anchor="end" font-size="11" letter-spacing="1" fill="#ffd54a" style="animation-delay:1.2s">EXPIRING</text><text class="s3 mono" x="550" y="96" text-anchor="end" font-size="11" letter-spacing="1" fill="#5a5b5c" style="animation-delay:1.2s">TERMINATED</text>
      </g><g>
        <text x="30" y="142" class="mono" font-size="12" fill="#eceae4">24h</text>
        <line x1="90" y1="138" x2="352" y2="138" stroke="#9d7bff" stroke-opacity=".2" stroke-dasharray="3 5"/>
        <rect class="gb" x="90" y="124" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:2.40s"/><rect class="gb" x="136" y="124" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:2.58s"/><rect class="gb" x="182" y="124" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:2.76s"/><rect class="gb" x="228" y="124" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:2.94s"/><rect class="gb" x="274" y="124" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:3.12s"/><rect class="gb" x="320" y="124" width="32" height="28" rx="7" fill="rgba(157,123,255,.08)" stroke="#9d7bff" stroke-opacity=".8" style="animation-delay:3.30s"/>
        <text class="s1 mono" x="550" y="142" text-anchor="end" font-size="11" letter-spacing="1" fill="#3dffa0" style="animation-delay:2.4s">RUNNING</text><text class="s2 mono" x="550" y="142" text-anchor="end" font-size="11" letter-spacing="1" fill="#ffd54a" style="animation-delay:2.4s">EXPIRING</text><text class="s3 mono" x="550" y="142" text-anchor="end" font-size="11" letter-spacing="1" fill="#5a5b5c" style="animation-delay:2.4s">TERMINATED</text>
      </g></g>
    <text x="30" y="214" class="mono" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#9d7bff">05 · GHOST CHAINS</text>
    <text x="30" y="252" class="sans" font-size="30" font-weight="750" letter-spacing="-.8" fill="#eceae4">Spawn ephemeral chains.</text>
    <text x="30" y="284" class="sans" font-size="17" fill="#a3a29d">Throwaway networks that live 15 minutes</text><text x="30" y="308" class="sans" font-size="17" fill="#a3a29d">to 24 hours, then vanish with a snapshot.</text>
  </g>
  <rect x=".5" y=".5" width="579" height="329" rx="20" fill="none" stroke="#fff" stroke-opacity=".09"/>
  
</svg>
