<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="REALITY FORK: Fork live Base state.">
<style>
  .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .spin,.spinr,.pop,.fade,.grow,.draw,.blink,.rise{transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.tr{animation:tr 1.2s linear infinite}@keyframes tr{to{transform:translateX(48px)}}</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect width="580" height="330" rx="20"/></clipPath>
    <radialGradient id="cgl" cx="290" cy="90" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c8ff4d" stop-opacity=".1"/><stop offset="1" stop-color="#c8ff4d" stop-opacity="0"/></radialGradient>
</defs>

  <g clip-path="url(#frame)">
    <rect width="580" height="330" fill="#0b0c0e"/>
    <rect width="580" height="178" fill="url(#grid)"/>
    <rect width="580" height="178" fill="url(#cgl)"/>
    <line x1="0" y1="178.5" x2="580" y2="178.5" stroke="#fff" stroke-opacity=".07"/>
    <g>
    <defs><linearGradient id="fl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff"/></linearGradient><mask id="fm"><rect width="232" height="178" fill="url(#fl)"/></mask></defs>
    <g mask="url(#fm)"><line x1="0" y1="90" x2="240" y2="90" stroke="#fff" stroke-opacity=".2"/><g class="tr"><rect x="-40" y="74" width="32" height="32" rx="7" fill="#0f1113" stroke="#fff" stroke-opacity=".22"/><rect x="8" y="74" width="32" height="32" rx="7" fill="#0f1113" stroke="#fff" stroke-opacity=".22"/><rect x="56" y="74" width="32" height="32" rx="7" fill="#0f1113" stroke="#fff" stroke-opacity=".22"/><rect x="104" y="74" width="32" height="32" rx="7" fill="#0f1113" stroke="#fff" stroke-opacity=".22"/><rect x="152" y="74" width="32" height="32" rx="7" fill="#0f1113" stroke="#fff" stroke-opacity=".22"/></g></g>
    <path d="M240 90 C 290 90, 300 46, 350 46 L 545 46" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>
    <path d="M240 90 C 290 90, 300 134, 350 134 L 545 134" fill="none" stroke="#c8ff4d" stroke-opacity=".8" stroke-width="1.5"/>
    <circle r="3" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="0s" path="M240 90 C 290 90, 300 46, 350 46 L 545 46"/></circle><circle r="3" fill="#fff"><animateMotion dur="2s" repeatCount="indefinite" begin="1s" path="M240 90 C 290 90, 300 46, 350 46 L 545 46"/></circle><circle r="3" fill="#c8ff4d"><animateMotion dur="2s" repeatCount="indefinite" begin="0s" path="M240 90 C 290 90, 300 134, 350 134 L 545 134"/></circle><circle r="3" fill="#c8ff4d"><animateMotion dur="2s" repeatCount="indefinite" begin="1s" path="M240 90 C 290 90, 300 134, 350 134 L 545 134"/></circle>
    <circle cx="240" cy="90" r="16" fill="#c8ff4d" opacity=".4" filter="url(#soft)"/>
    <circle cx="240" cy="90" r="7" fill="#c8ff4d"/>
    <text x="545" y="32" text-anchor="end" class="mono" font-size="11.5" fill="#3dffa0">original · success · 27,766 gas</text>
    <text x="545" y="160" text-anchor="end" class="mono" font-size="11.5" fill="#ffd54a">modified · reverted · 21,160 gas</text>
    <text x="30" y="40" class="mono" font-size="11" letter-spacing="1" fill="#5a5b5c">BLOCK 49,851,225</text></g>
    <text x="30" y="214" class="mono" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#c8ff4d">02 · REALITY FORK</text>
    <text x="30" y="252" class="sans" font-size="30" font-weight="750" letter-spacing="-.8" fill="#eceae4">Fork live Base state.</text>
    <text x="30" y="284" class="sans" font-size="17" fill="#a3a29d">Two forks of the same block. Change code,</text><text x="30" y="308" class="sans" font-size="17" fill="#a3a29d">storage or balances. Diff every call tree.</text>
  </g>
  <rect x=".5" y=".5" width="579" height="329" rx="20" fill="none" stroke="#fff" stroke-opacity=".09"/>
  
</svg>
