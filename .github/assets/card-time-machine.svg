<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="TIME MACHINE: Rewind any transaction.">
<style>
  .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .spin,.spinr,.pop,.fade,.grow,.draw,.blink,.rise{transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.fillc{opacity:0;animation:fc 6s ease-out infinite}
     @keyframes fc{0%{opacity:0}6%{opacity:.18}80%{opacity:.18}90%,100%{opacity:0}}
     .scan{animation:sc 6s linear infinite}
     @keyframes sc{0%{transform:translateX(0);opacity:1}50%{transform:translateX(484px);opacity:1}55%,100%{transform:translateX(484px);opacity:0}}
     .ok{opacity:0;animation:ok 6s ease infinite}
     @keyframes ok{0%,52%{opacity:0}58%,86%{opacity:1}94%,100%{opacity:0}}</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect width="580" height="330" rx="20"/></clipPath>
    <radialGradient id="cgl" cx="290" cy="90" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c8ff4d" stop-opacity=".1"/><stop offset="1" stop-color="#c8ff4d" stop-opacity="0"/></radialGradient>
</defs>

  <g clip-path="url(#frame)">
    <rect width="580" height="330" fill="#0b0c0e"/>
    <rect width="580" height="178" fill="url(#grid)"/>
    <rect width="580" height="178" fill="url(#cgl)"/>
    <line x1="0" y1="178.5" x2="580" y2="178.5" stroke="#fff" stroke-opacity=".07"/>
    <g>
    <text x="30" y="40" class="mono" font-size="11" letter-spacing="1" fill="#5a5b5c">FORK PARENT → REPLAY PREFIX → MINE</text>
    <g>
        <rect x="46" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#4fe3ff" stroke-opacity="0.3"/>
        <rect class="fillc" x="46" y="66" width="44" height="44" rx="9" fill="#4fe3ff" style="animation-delay:0.00s"/>
        <text x="68" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#a3a29d">0x7e</text>
      </g><g>
        <rect x="108" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#4fe3ff" stroke-opacity="0.3"/>
        <rect class="fillc" x="108" y="66" width="44" height="44" rx="9" fill="#4fe3ff" style="animation-delay:0.38s"/>
        <text x="130" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#a3a29d">0x7e</text>
      </g><g>
        <rect x="170" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#ffffff" stroke-opacity="0.3"/>
        <rect class="fillc" x="170" y="66" width="44" height="44" rx="9" fill="#ffffff" style="animation-delay:0.75s"/>
        <text x="192" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#a3a29d">tx 2</text>
      </g><g>
        <rect x="232" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#ffffff" stroke-opacity="0.3"/>
        <rect class="fillc" x="232" y="66" width="44" height="44" rx="9" fill="#ffffff" style="animation-delay:1.13s"/>
        <text x="254" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#a3a29d">tx 3</text>
      </g><g>
        <rect x="294" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#ffffff" stroke-opacity="0.3"/>
        <rect class="fillc" x="294" y="66" width="44" height="44" rx="9" fill="#ffffff" style="animation-delay:1.50s"/>
        <text x="316" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#a3a29d">tx 4</text>
      </g><g>
        <rect x="356" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#ffffff" stroke-opacity="0.3"/>
        <rect class="fillc" x="356" y="66" width="44" height="44" rx="9" fill="#ffffff" style="animation-delay:1.88s"/>
        <text x="378" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#a3a29d">tx 5</text>
      </g><g>
        <rect x="418" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#ffffff" stroke-opacity="0.3"/>
        <rect class="fillc" x="418" y="66" width="44" height="44" rx="9" fill="#ffffff" style="animation-delay:2.25s"/>
        <text x="440" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#a3a29d">tx 6</text>
      </g><g>
        <rect x="480" y="66" width="44" height="44" rx="9" fill="#0f1113" stroke="#c8ff4d" stroke-opacity="0.9"/>
        <rect class="fillc" x="480" y="66" width="44" height="44" rx="9" fill="#c8ff4d" style="animation-delay:2.63s"/>
        <text x="502" y="128" text-anchor="middle" class="mono" font-size="10.5" fill="#c8ff4d">target</text>
      </g>
    <rect class="scan" x="40" y="58" width="2" height="60" fill="#c8ff4d"/>
    <g class="ok"><text x="550" y="40" text-anchor="end" class="mono" font-size="11.5" fill="#3dffa0">✓ status · gas · logs · block match</text></g>
    <text x="30" y="160" class="mono" font-size="11" fill="#a3a29d">pinned: Base Sepolia block 49,873,286 · 113,939 gas · 2 events</text></g>
    <text x="30" y="214" class="mono" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#c8ff4d">03 · TIME MACHINE</text>
    <text x="30" y="252" class="sans" font-size="30" font-weight="750" letter-spacing="-.8" fill="#eceae4">Rewind any transaction.</text>
    <text x="30" y="284" class="sans" font-size="17" fill="#a3a29d">Fork its parent block, replay everything</text><text x="30" y="308" class="sans" font-size="17" fill="#a3a29d">ahead of it, match the real receipt. Then edit.</text>
  </g>
  <rect x=".5" y=".5" width="579" height="329" rx="20" fill="none" stroke="#fff" stroke-opacity=".09"/>
  
</svg>
