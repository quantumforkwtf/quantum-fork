<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" role="img" aria-label="QUANTUM SHIELD: Post-quantum, measured.">
<style>
  .sans{font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}
  .spin,.spinr,.pop,.fade,.grow,.draw,.blink,.rise{transform-box:fill-box;transform-origin:center}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes spinr{to{transform:rotate(-360deg)}}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.4);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-32}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
.qb{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:qb 7s cubic-bezier(.16,1,.3,1) infinite}
     @keyframes qb{0%{transform:scaleX(0)}14%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}</style>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <clipPath id="frame"><rect width="580" height="330" rx="20"/></clipPath>
    <radialGradient id="cgl" cx="290" cy="90" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9d7bff" stop-opacity=".1"/><stop offset="1" stop-color="#9d7bff" stop-opacity="0"/></radialGradient>
</defs>

  <g clip-path="url(#frame)">
    <rect width="580" height="330" fill="#0b0c0e"/>
    <rect width="580" height="178" fill="url(#grid)"/>
    <rect width="580" height="178" fill="url(#cgl)"/>
    <line x1="0" y1="178.5" x2="580" y2="178.5" stroke="#fff" stroke-opacity=".07"/>
    <g><text x="30" y="28" class="mono" font-size="11" letter-spacing="1" fill="#5a5b5c">SIGNATURE SIZE · FIPS 204 / FIPS 205 · MEASURED IN-BROWSER</text><text x="30" y="52" class="mono" font-size="11.5" fill="#eceae4">ECDSA secp256k1</text>
        <rect class="qb" x="160" y="42" width="3.0" height="11" rx="3" fill="#ff4d5e" style="animation-delay:0.00s"/>
        <text x="550" y="52" text-anchor="end" class="mono" font-size="11.5" fill="#ff4d5e">65 B</text><text x="30" y="74" class="mono" font-size="11.5" fill="#eceae4">ML-DSA-44</text>
        <rect class="qb" x="160" y="64" width="35.4" height="11" rx="3" fill="#9d7bff" style="animation-delay:0.25s"/>
        <text x="550" y="74" text-anchor="end" class="mono" font-size="11.5" fill="#9d7bff">2,420 B</text><text x="30" y="96" class="mono" font-size="11.5" fill="#eceae4">ML-DSA-87</text>
        <rect class="qb" x="160" y="86" width="67.7" height="11" rx="3" fill="#9d7bff" style="animation-delay:0.50s"/>
        <text x="550" y="96" text-anchor="end" class="mono" font-size="11.5" fill="#9d7bff">4,627 B</text><text x="30" y="118" class="mono" font-size="11.5" fill="#eceae4">SLH-DSA-128s</text>
        <rect class="qb" x="160" y="108" width="114.9" height="11" rx="3" fill="#4fe3ff" style="animation-delay:0.75s"/>
        <text x="550" y="118" text-anchor="end" class="mono" font-size="11.5" fill="#4fe3ff">7,856 B</text><text x="30" y="140" class="mono" font-size="11.5" fill="#eceae4">SLH-DSA-128f</text>
        <rect class="qb" x="160" y="130" width="250.0" height="11" rx="3" fill="#4fe3ff" style="animation-delay:1.00s"/>
        <text x="550" y="140" text-anchor="end" class="mono" font-size="11.5" fill="#4fe3ff">17,088 B</text>
    <text x="30" y="166" class="mono" font-size="10.5" fill="#a3a29d">ML-DSA-44 signature = 37× ECDSA · 38,240 gas of calldata to carry it</text></g>
    <text x="30" y="214" class="mono" font-size="12.5" font-weight="700" letter-spacing="2.5" fill="#9d7bff">07 · QUANTUM SHIELD</text>
    <text x="30" y="252" class="sans" font-size="30" font-weight="750" letter-spacing="-.8" fill="#eceae4">Post-quantum, measured.</text>
    <text x="30" y="284" class="sans" font-size="17" fill="#a3a29d">ML-DSA and SLH-DSA next to ECDSA, live on your</text><text x="30" y="308" class="sans" font-size="17" fill="#a3a29d">device: key sizes, speed, and the gas to carry them.</text>
  </g>
  <rect x=".5" y=".5" width="579" height="329" rx="20" fill="none" stroke="#fff" stroke-opacity=".09"/>
  
</svg>
