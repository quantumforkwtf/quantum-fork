<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" />
<style>
  body { margin: 0; background: #060708; color: #eceae4; font: 14px Geist, sans-serif; padding: 30px 40px; }
  .row { display: flex; align-items: center; gap: 40px; padding: 22px 0; border-bottom: 1px solid #1c1f22; }
  .row h3 { width: 40px; margin: 0; font: 600 13px 'Geist Mono'; color: #8a8f94; }
  .nav { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15.5px; letter-spacing: -0.02em; padding: 10px 14px; border: 1px solid #1c1f22; border-radius: 10px; }
  svg { display: block; }
</style>
</head>
<body>
<template id="K">
  <svg viewBox="0 0 32 32" fill="none">
    <defs><linearGradient id="gK" x1="8" y1="0" x2="24" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#C8FF4D"/><stop offset="1" stop-color="#4FE3FF"/></linearGradient></defs>
    <path d="M8 6.5V13a8 8 0 0 0 3.6 6.68M24 6.5V13a8 8 0 0 1-3.6 6.68" stroke="url(#gK)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M16 4.5v23" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
  </svg>
</template>
<template id="L">
  <svg viewBox="0 0 32 32" fill="none">
    <path d="M8 6.5V13a8 8 0 0 0 3.6 6.68" stroke="#C8FF4D" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M24 6.5V13a8 8 0 0 1-3.6 6.68" stroke="#4FE3FF" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M16 4.5v23" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
  </svg>
</template>
<template id="M">
  <svg viewBox="0 0 32 32" fill="none">
    <defs>
      <linearGradient id="gM" x1="9" y1="0" x2="23" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#C8FF4D"/><stop offset="1" stop-color="#4FE3FF"/></linearGradient>
      <radialGradient id="tM" cx="16" cy="10" r="22" gradientUnits="userSpaceOnUse"><stop stop-color="#18201A"/><stop offset="1" stop-color="#07080A"/></radialGradient>
    </defs>
    <rect x=".6" y=".6" width="30.8" height="30.8" rx="8.4" fill="url(#tM)" stroke="#ECEAE4" stroke-opacity=".14" stroke-width="1.2"/>
    <path d="M10 9v4.5a6 6 0 0 0 2.7 5.01M22 9v4.5a6 6 0 0 1-2.7 5.01" stroke="url(#gM)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M16 7v18" stroke="#ECEAE4" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
</template>
<div id="out"></div>
<script>
  const sizes = [16, 20, 28, 48, 96, 180]
  for (const id of ['K', 'L', 'M']) {
    const row = document.createElement('div'); row.className = 'row'
    row.innerHTML = `<h3>${id}</h3>`
    for (const s of sizes) {
      const svg = document.getElementById(id).content.firstElementChild.cloneNode(true)
      svg.setAttribute('width', s); svg.setAttribute('height', s)
      row.appendChild(svg)
    }
    const nav = document.createElement('div'); nav.className = 'nav'
    const svg = document.getElementById(id).content.firstElementChild.cloneNode(true)
    svg.setAttribute('width', 30); svg.setAttribute('height', 30)
    nav.appendChild(svg); nav.append('Quantum Fork')
    row.appendChild(nav)
    document.getElementById('out').appendChild(row)
  }
</script>
</body>
</html>
