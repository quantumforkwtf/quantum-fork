<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" />
<style>
  body { margin: 0; background: #060708; color: #eceae4; font: 14px Geist, sans-serif; padding: 40px; }
  .row { display: flex; align-items: center; gap: 44px; padding: 26px 0; border-bottom: 1px solid #1c1f22; }
  .row h3 { width: 60px; margin: 0; font: 600 13px 'Geist Mono'; color: #8a8f94; }
  .nav { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15.5px; letter-spacing: -0.02em; }
  svg { display: block; }
</style>
</head>
<body>
<template id="A">
  <svg viewBox="0 0 32 32" fill="none">
    <defs><linearGradient id="gA" x1="8" y1="0" x2="24" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#C8FF4D"/><stop offset="1" stop-color="#4FE3FF"/></linearGradient></defs>
    <path d="M9 9v4.5a7 7 0 0 0 14 0V9" stroke="url(#gA)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M16 6.5V26" stroke="#ECEAE4" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
</template>
<template id="B">
  <svg viewBox="0 0 32 32" fill="none">
    <rect x=".75" y=".75" width="30.5" height="30.5" rx="8.25" fill="#0C0E10" stroke="#ECEAE4" stroke-opacity=".16" stroke-width="1.5"/>
    <path d="M9.5 9.5v4a6.5 6.5 0 0 0 13 0v-4" stroke="#ECEAE4" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M16 13v12.5" stroke="#ECEAE4" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="9.5" cy="8" r="2.3" fill="#C8FF4D"/>
    <circle cx="22.5" cy="8" r="2.3" fill="#4FE3FF"/>
    <circle cx="16" cy="8" r="2.3" fill="#ECEAE4"/>
  </svg>
</template>
<template id="C">
  <svg viewBox="0 0 32 32" fill="none">
    <circle cx="6.5" cy="16" r="2.6" fill="#ECEAE4"/>
    <path d="M7 16c8 0 8-7.5 16-7.5M7 16c8 0 8 7.5 16 7.5" stroke="#ECEAE4" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="25" cy="8.5" r="2.6" fill="#C8FF4D"/>
    <circle cx="25" cy="23.5" r="2.6" fill="#4FE3FF"/>
  </svg>
</template>
<template id="D">
  <svg viewBox="0 0 32 32" fill="none">
    <path d="M16 2.6 27.6 9.3v13.4L16 29.4 4.4 22.7V9.3z" stroke="#ECEAE4" stroke-opacity=".22" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M10 10v3.6a6 6 0 0 0 12 0V10" stroke="#ECEAE4" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M16 8v16" stroke="#ECEAE4" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="10" cy="9" r="2" fill="#C8FF4D"/>
    <circle cx="22" cy="9" r="2" fill="#4FE3FF"/>
  </svg>
</template>
<template id="E">
  <svg viewBox="0 0 32 32" fill="none">
    <path d="M8.5 7.5v6a7.5 7.5 0 0 0 15 0v-6" stroke="#ECEAE4" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M16 5v22" stroke="#ECEAE4" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="8.5" cy="6.4" r="2.9" fill="#C8FF4D"/>
    <circle cx="23.5" cy="6.4" r="2.9" fill="#4FE3FF"/>
  </svg>
</template>
<template id="F">
  <svg viewBox="0 0 32 32" fill="none">
    <rect width="32" height="32" rx="8" fill="#C8FF4D"/>
    <path d="M9.5 9v4.5a6.5 6.5 0 0 0 13 0V9" stroke="#060708" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M16 6.5v19" stroke="#060708" stroke-width="2.6" stroke-linecap="round"/>
  </svg>
</template>
<div id="out"></div>
<script>
  const sizes = [16, 22, 28, 48, 96, 200]
  for (const id of ['A', 'B', 'C', 'D', 'E', 'F']) {
    const row = document.createElement('div'); row.className = 'row'
    row.innerHTML = `<h3>${id}</h3>`
    for (const s of sizes) {
      const svg = document.getElementById(id).content.firstElementChild.cloneNode(true)
      svg.setAttribute('width', s); svg.setAttribute('height', s)
      row.appendChild(svg)
    }
    const nav = document.createElement('div'); nav.className = 'nav'
    const svg = document.getElementById(id).content.firstElementChild.cloneNode(true)
    svg.setAttribute('width', 28); svg.setAttribute('height', 28)
    nav.appendChild(svg); nav.append('Quantum Fork')
    row.appendChild(nav)
    document.getElementById('out').appendChild(row)
  }
</script>
</body>
</html>
