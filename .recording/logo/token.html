<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: #060708; }
  .tile { position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 46%, rgba(200,255,77,.16), transparent 42%),
      radial-gradient(circle at 62% 58%, rgba(79,227,255,.13), transparent 46%),
      radial-gradient(circle at 50% 50%, #10140f 0%, #060708 70%); }
  .grid { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(236,234,228,.16) 1.4px, transparent 1.8px); background-size: 32px 32px;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 0%, transparent 62%); }
  .ring { position: absolute; left: 50%; top: 50%; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%;
    border: 2px solid rgba(236,234,228,.08); }
  .ring.r2 { width: 600px; height: 600px; margin: -300px 0 0 -300px; border-color: rgba(200,255,77,.12); border-style: dashed; }
  svg { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; margin: -280px 0 0 -280px; overflow: visible; }
  .glow { filter: blur(1.1px); opacity: .75; }
</style>
</head>
<body>
  <div class="tile"></div>
  <div class="grid"></div>
  <div class="ring"></div>
  <div class="ring r2"></div>
  <svg viewBox="0 0 32 32" fill="none">
    <g class="glow">
      <path d="M8 6.5V13a8 8 0 0 0 3.6 6.68" stroke="#C8FF4D" stroke-width="3.2" stroke-linecap="round" />
      <path d="M24 6.5V13a8 8 0 0 1-3.6 6.68" stroke="#4FE3FF" stroke-width="3.2" stroke-linecap="round" />
      <path d="M16 4.5v23" stroke="#ECEAE4" stroke-opacity=".5" stroke-width="3.2" stroke-linecap="round" />
    </g>
    <path d="M8 6.5V13a8 8 0 0 0 3.6 6.68" stroke="#C8FF4D" stroke-width="3.2" stroke-linecap="round" />
    <path d="M24 6.5V13a8 8 0 0 1-3.6 6.68" stroke="#4FE3FF" stroke-width="3.2" stroke-linecap="round" />
    <path d="M16 4.5v23" stroke="#F4F2EC" stroke-width="3.2" stroke-linecap="round" />
  </svg>
</body>
</html>
