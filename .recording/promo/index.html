<!doctype html>
<html lang="en">
<head>

<title>Quantum Fork — promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link rel="stylesheet" href="./promo.css" />

<body>
<div id="film">
  <div class="bg">
    <div class="grid"></div>
    <i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i>
  </div>

  <canvas id="organism" aria-hidden="true"></canvas>

  <div id="intro">
    <svg id="bigmark" viewBox="0 0 32 32" fill="none">
      <g class="halo">
        <path class="arm-l" pathLength="1" d="M11.6 19.68A8 8 0 0 1 8 13V6.5" stroke="#C8FF4D" stroke-width="3.2" stroke-linecap="round" />
        <path class="arm-r" pathLength="1" d="M20.4 19.68A8 8 0 0 0 24 13V6.5" stroke="#4FE3FF" stroke-width="3.2" stroke-linecap="round" />
        <path class="stem" pathLength="1" d="M16 27.5V4.5" stroke="#ECEAE4" stroke-opacity=".55" stroke-width="3.2" stroke-linecap="round" />
      </g>
      <path class="arm-l" pathLength="1" d="M11.6 19.68A8 8 0 0 1 8 13V6.5" stroke="#C8FF4D" stroke-width="3.2" stroke-linecap="round" />
      <path class="arm-r" pathLength="1" d="M20.4 19.68A8 8 0 0 0 24 13V6.5" stroke="#4FE3FF" stroke-width="3.2" stroke-linecap="round" />
      <path class="stem" pathLength="1" d="M16 27.5V4.5" stroke="#F4F2EC" stroke-width="3.2" stroke-linecap="round" />
    </svg>
    <h1 id="word"></h1>
    <p id="tag">Build for the <em>quantum future.</em></p>
  </div>

  <div id="lockup">
    <svg viewBox="0 0 32 32" fill="none">
      <path d="M8 6.5V13a8 8 0 0 0 3.6 6.68" stroke="#C8FF4D" stroke-width="3.2" stroke-linecap="round" />
      <path d="M24 6.5V13a8 8 0 0 1-3.6 6.68" stroke="#4FE3FF" stroke-width="3.2" stroke-linecap="round" />
      <path d="M16 4.5v23" stroke="#ECEAE4" stroke-width="3.2" stroke-linecap="round" />
    </svg>
    <span>Quantum Fork</span>
  </div>

  <div id="beats"></div>
  <div id="windows"></div>
  <ul id="systems"></ul>
  <div id="dots"></div>

  <div id="outro">
    <div class="tile">
      <svg viewBox="0 0 32 32" fill="none">
        <path d="M8 6.5V13a8 8 0 0 0 3.6 6.68" stroke="#C8FF4D" stroke-width="3.2" stroke-linecap="round" />
        <path d="M24 6.5V13a8 8 0 0 1-3.6 6.68" stroke="#4FE3FF" stroke-width="3.2" stroke-linecap="round" />
        <path d="M16 4.5v23" stroke="#F4F2EC" stroke-width="3.2" stroke-linecap="round" />
      </svg>
    </div>
    <h1>Quantum <b>Fork</b></h1>
    <p>Build for the <em>quantum future.</em></p>
    <div class="ctas">
      <span class="cta primary">Start building at quantumfork.wtf</span>
      <span class="cta">Try the demo · no wallet needed</span>
    </div>
  </div>

<script type="module" src="./promo.ts"></script>
