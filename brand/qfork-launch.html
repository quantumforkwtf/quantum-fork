<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&family=Instrument+Serif:ital@1&display=swap" />
<style>
  html, body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #060708; }
  body { position: relative; color: #ECEAE4; font-family: 'Geist', system-ui, sans-serif; }
  svg.bg { position: absolute; inset: 0; display: block; }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }

  .top { position: absolute; left: 88px; right: 88px; top: 72px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 26px; letter-spacing: -0.01em; }
  .brand .word { display: inline-flex; align-items: center; }
  .brand .word svg { height: 1.34em; }
  .chip { display: inline-flex; align-items: center; gap: 12px; padding: 12px 20px 12px 18px; border: 1px solid rgba(200,255,77,0.45); border-radius: 999px;
          background: rgba(200,255,77,0.06); color: #C8FF4D; font-size: 15px; letter-spacing: 0.2em; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: #C8FF4D; box-shadow: 0 0 12px #C8FF4D; }

  .copy { position: absolute; left: 88px; top: 196px; }
  h1 { margin: 0; font-weight: 600; font-size: 168px; line-height: 0.92; letter-spacing: -0.045em; }
  h1 em { font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; color: #C8FF4D; letter-spacing: -0.02em; }
  p.sub { margin: 30px 0 0; max-width: 820px; color: rgba(236,234,228,0.62); font-size: 30px; line-height: 1.35; letter-spacing: -0.01em; }
  p.sub b { color: #ECEAE4; font-weight: 500; }

  .foot { position: absolute; left: 88px; right: 88px; bottom: 64px; display: flex; justify-content: space-between; font-size: 15px; letter-spacing: 0.24em; color: rgba(236,234,228,0.5); }
  .foot b { color: #ECEAE4; font-weight: 500; }
</style>
</head>
<body>
<svg class="bg" id="s" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <radialGradient id="halo" cx="900" cy="650" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FF0C0" stop-opacity="0.08" />
      <stop offset="1" stop-color="#7FF0C0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.18" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.94" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.15" />
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <rect width="1600" height="900" fill="url(#fadeL)" />
    </mask>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#ECEAE4" fill-opacity="0.07" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#dots)" />
  <rect width="1600" height="900" fill="url(#halo)" />
  <g id="dna" mask="url(#m)" fill="none" stroke-linecap="round"></g>
  <g id="notes" fill="none"></g>
</svg>

<div class="top">
  <div class="brand mono">
    <span class="word">
      <svg viewBox="0 0 8 20" style="width:0.54em" fill="none"><path d="M2.5 1.5V18.5" stroke="#C8FF4D" stroke-width="1.6" /></svg>quantum fork<svg viewBox="0 0 10 20" style="width:0.67em" fill="none"><path d="M2 1.5L7.6 10L2 18.5" stroke="#C8FF4D" stroke-width="1.6" /></svg>
    </span>
  </div>
  <div class="chip mono"><i></i>LIVE ON PUMP.FUN</div>
</div>

<div class="copy">
  <h1>$QFORK <em>is live.</em></h1>
  <p class="sub">Fork Solana into <b>post-quantum descendants</b>. Burn $QFORK to register yours, verified on-chain.</p>
</div>

<div class="foot mono"><b>QUANTUMFORK.WTF</b><span>@QUANTUMFORKWTF</span></div>

<script>
  const NS = 'http://www.w3.org/2000/svg'
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v)
    parent.appendChild(n)
    return n
  }
  const LIME = '#C8FF4D', CYAN = '#4FE3FF', INK = '#ECEAE4'
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t) }

  const y0 = 668, xf = 760, period = 230, L = 400, D = 104
  const open = (x) => { const t = clamp((x - xf) / L); return Math.sin((t * Math.PI) / 2) }
  const amp = (x) => 44 - 10 * smooth((x - xf) / L)
  const th = (x) => (2 * Math.PI * (x - xf)) / period
  const yU = (x) => y0 - D * open(x)
  const yL = (x) => y0 + D * open(x)
  const born = xf + period / 2
  const newIn = (x) => smooth((x - born) / 70)
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
  const BG = hex('#060708')
  const mix = (col, op) => `rgb(${hex(col).map((c, i) => Math.round(BG[i] + (c - BG[i]) * op)).join(',')})`

  const strands = [
    { c: (x) => (x < xf ? y0 : yU(x)), s: 1, col: LIME, o: () => 1 },
    { c: (x) => (x < xf ? y0 : yL(x)), s: -1, col: LIME, o: () => 1 },
    { c: yU, s: -1, col: CYAN, o: newIn, from: born },
    { c: yL, s: 1, col: CYAN, o: newIn, from: born },
  ]
  const yOf = (st, x) => st.c(x) + st.s * amp(x) * Math.sin(th(x))
  const depth = (st, x) => 0.5 + 0.5 * st.s * Math.cos(th(x))

  const segs = []
  const step = 3
  for (const st of strands) {
    for (let x = st.from ?? -20; x < 1620; x += step) {
      const o = st.o(x)
      if (o < 0.01) continue
      const f = depth(st, x + step / 2)
      segs.push({ z: f, x1: x, y1: yOf(st, x), x2: x + step, y2: yOf(st, x + step), col: st.col, w: 1 + 2.4 * f, op: (0.22 + 0.78 * f) * o })
    }
  }

  const rungs = []
  const pair = (a, b, x, op) => {
    const ya = yOf(a, x), yb = yOf(b, x)
    if (Math.abs(ya - yb) < 10) return
    const mid = (ya + yb) / 2, gap = Math.sign(yb - ya) * 2.5
    rungs.push({ x, y1: ya, y2: mid - gap, col: a.col, op })
    rungs.push({ x, y1: yb, y2: mid + gap, col: b.col, op })
  }
  for (let x = -10; x < 1620; x += 15) {
    if (x < xf - 8) { pair(strands[0], strands[1], x, 0.32); continue }
    const n = newIn(x)
    for (const [old, fresh] of [[strands[0], strands[2]], [strands[1], strands[3]]]) {
      if (n > 0.55) { pair(old, fresh, x, 0.32 * n); continue }
      const ya = yOf(old, x), toward = old.c(x) - ya
      if (Math.abs(toward) < 8) continue
      rungs.push({ x, y1: ya, y2: ya + toward * 0.55, col: old.col, op: 0.36 })
    }
  }

  const dna = document.getElementById('dna')
  for (const r of rungs) el('line', { x1: r.x, y1: r.y1, x2: r.x, y2: r.y2, stroke: r.col, 'stroke-width': 1, 'stroke-opacity': r.op }, dna)
  segs.sort((a, b) => a.z - b.z)
  for (const s of segs) el('line', { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, stroke: mix(s.col, s.op), 'stroke-width': s.w.toFixed(2) }, dna)

  const notes = document.getElementById('notes')
  const label = (x, y, text, anchor = 'start', op = 0.5) => {
    const t = el('text', { x, y, 'font-size': 12, fill: INK, 'fill-opacity': op, 'text-anchor': anchor, 'letter-spacing': '0.24em', 'font-family': 'Geist Mono, monospace' }, notes)
    t.textContent = text
  }
  el('circle', { cx: xf, cy: y0, r: 5, stroke: INK, 'stroke-opacity': 0.55, 'stroke-width': 1 }, notes)
  el('path', { d: `M${xf} ${y0 - 9}V${y0 - 92}H${xf + 22}`, stroke: INK, 'stroke-opacity': 0.25, 'stroke-width': 1 }, notes)
  label(xf + 30, y0 - 88, 'REPLICATION FORK')
  label(330, y0 + 84, 'GEN-0 · SOLANA', 'start', 0.42)
  label(1512, yU(1512) - 66, 'GEN-1 · DESCENDANT', 'end', 0.42)
</script>
</body>
</html>
