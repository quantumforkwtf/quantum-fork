<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; background: #060708; }
  svg { display: block; }
  text { font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace; }
</style>
</head>
<body>
<svg id="s" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <radialGradient id="halo" cx="760" cy="250" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FF0C0" stop-opacity="0.075" />
      <stop offset="1" stop-color="#7FF0C0" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0" />
      <stop offset="0.2" stop-color="#fff" stop-opacity="1" />
      <stop offset="0.93" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.15" />
    </linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1500" height="500">
      <rect width="1500" height="500" fill="url(#fadeL)" />
    </mask>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.8" fill="#ECEAE4" fill-opacity="0.07" />
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#dots)" />
  <rect width="1500" height="500" fill="url(#halo)" />
  <g id="dna" mask="url(#m)" fill="none" stroke-linecap="round"></g>
  <g id="notes" fill="none"></g>
</svg>
<script>
  const NS = 'http://www.w3.org/2000/svg'
  const el = (tag, attrs, parent) => {
    const n = document.createElementNS(NS, tag)
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v)
    parent.appendChild(n)
    return n
  }
  const LIME = '#C8FF4D', CYAN = '#4FE3FF', INK = '#ECEAE4'
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t) }

  const y0 = 250, xf = 700, period = 210, L = 360, D = 112
  const open = (x) => { const t = clamp((x - xf) / L); return Math.sin((t * Math.PI) / 2) }
  const amp = (x) => 46 - 10 * smooth((x - xf) / L)
  const th = (x) => (2 * Math.PI * (x - xf)) / period
  const yU = (x) => y0 - D * open(x)
  const yL = (x) => y0 + D * open(x)
  const born = xf + period / 2
  const newIn = (x) => smooth((x - born) / 70)
  const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16))
  const BG = hex('#060708')
  const mix = (col, op) => `rgb(${hex(col).map((c, i) => Math.round(BG[i] + (c - BG[i]) * op)).join(',')})`

  // Each strand: centre line, sign of the sine, colour, and an opacity envelope.
  const strands = [
    { c: (x) => (x < xf ? y0 : yU(x)), s: 1, col: LIME, o: () => 1 },
    { c: (x) => (x < xf ? y0 : yL(x)), s: -1, col: LIME, o: () => 1 },
    { c: yU, s: -1, col: CYAN, o: newIn, from: born },
    { c: yL, s: 1, col: CYAN, o: newIn, from: born },
  ]
  const yOf = (st, x) => st.c(x) + st.s * amp(x) * Math.sin(th(x))
  const depth = (st, x) => 0.5 + 0.5 * st.s * Math.cos(th(x))

  const segs = []
  const step = 3
  for (const st of strands) {
    for (let x = st.from ?? -20; x < 1520; x += step) {
      const o = st.o(x)
      if (o < 0.01) continue
      const f = depth(st, x + step / 2)
      segs.push({ z: f, x1: x, y1: yOf(st, x), x2: x + step, y2: yOf(st, x + step), col: st.col, w: 0.9 + 2.1 * f, op: (0.22 + 0.78 * f) * o })
    }
  }

  // Base pairs: full rungs in the parent helix, single unpaired stubs just past the fork, new rungs as copies form.
  const rungs = []
  const pair = (a, b, x, op) => {
    const ya = yOf(a, x), yb = yOf(b, x)
    if (Math.abs(ya - yb) < 10) return
    const mid = (ya + yb) / 2, gap = Math.sign(yb - ya) * 2.5
    rungs.push({ x, y1: ya, y2: mid - gap, col: a.col, op })
    rungs.push({ x, y1: yb, y2: mid + gap, col: b.col, op })
  }
  for (let x = -10; x < 1520; x += 15) {
    if (x < xf - 8) { pair(strands[0], strands[1], x, 0.32); continue }
    const n = newIn(x)
    for (const [old, fresh] of [[strands[0], strands[2]], [strands[1], strands[3]]]) {
      if (n > 0.55) { pair(old, fresh, x, 0.32 * n); continue }
      const ya = yOf(old, x), toward = old.c(x) - ya
      if (Math.abs(toward) < 8) continue
      rungs.push({ x, y1: ya, y2: ya + toward * 0.55, col: old.col, op: 0.36 })
    }
  }

  const dna = document.getElementById('dna')
  for (const r of rungs) el('line', { x1: r.x, y1: r.y1, x2: r.x, y2: r.y2, stroke: r.col, 'stroke-width': 1, 'stroke-opacity': r.op }, dna)
  segs.sort((a, b) => a.z - b.z)
  for (const s of segs) el('line', { x1: s.x1, y1: s.y1, x2: s.x2, y2: s.y2, stroke: mix(s.col, s.op), 'stroke-width': s.w.toFixed(2) }, dna)

  // Diagram annotations, kept quiet.
  const notes = document.getElementById('notes')
  el('circle', { cx: xf, cy: y0, r: 5, stroke: INK, 'stroke-opacity': 0.55, 'stroke-width': 1 }, notes)
  el('path', { d: `M${xf} ${y0 + 9}V392H${xf + 22}`, stroke: INK, 'stroke-opacity': 0.25, 'stroke-width': 1 }, notes)
  const t = el('text', { x: xf + 30, y: 396, 'font-size': 11, fill: INK, 'fill-opacity': 0.5, 'letter-spacing': '0.24em' }, notes)
  t.textContent = 'REPLICATION FORK'
  const brand = el('text', { x: 1440, y: 462, 'font-size': 12, fill: INK, 'fill-opacity': 0.42, 'text-anchor': 'end', 'letter-spacing': '0.24em' }, notes)
  brand.textContent = 'QUANTUM FORK · QUANTUMFORK.WTF'
</script>
</body>
</html>
